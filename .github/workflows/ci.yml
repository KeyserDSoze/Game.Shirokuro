name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Shirokuro.slnx
      - run: dotnet build Shirokuro.slnx -c Release --no-restore
      - run: dotnet test Shirokuro.slnx -c Release --no-build
        env:
          SHIROKURO_TEST_REDIS: localhost:6379

      # This separate TLS-only fixture exercises the *actual* Production
      # StackExchangeRedisCache and lobby multiplexer, not test DI fakes.
      # CA, cert and keys are freshly generated on each CI runner, never
      # stored in the repo or uploaded as artifacts.
      - name: Start ephemeral certificate-validated TLS-only Redis
        shell: bash
        run: |
          set -euo pipefail
          certdir="$(mktemp -d /tmp/shirokuro-redis-tls-XXXXXX)"
          echo "SHIROKURO_TLS_CERT_DIR=$certdir" >> "$GITHUB_ENV"

          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -subj "/CN=Shirokuro Ephemeral CI Root" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" \
            -keyout "$certdir/ca.key" -out "$certdir/ca.crt"
          openssl req -new -newkey rsa:2048 -nodes -sha256 \
            -subj "/CN=localhost" \
            -keyout "$certdir/server.key" -out "$certdir/server.csr"
          cat > "$certdir/server.ext" <<'CERT_EXT'
          basicConstraints=critical,CA:FALSE
          keyUsage=digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          # Docker DNS is used only for TLS-authenticated replication.
          subjectAltName=DNS:localhost,DNS:shirokuro-ci-redis-ha-master,IP:127.0.0.1
          CERT_EXT
          openssl x509 -req -in "$certdir/server.csr" \
            -CA "$certdir/ca.crt" -CAkey "$certdir/ca.key" -CAcreateserial \
            -out "$certdir/server.crt" -days 1 -sha256 \
            -extfile "$certdir/server.ext"
          openssl verify -CAfile "$certdir/ca.crt" \
            -verify_hostname localhost "$certdir/server.crt"

          # Trust the CA on the runner, not by disabling TLS verification
          # inside Shirokuro or a test-only certificate callback.
          sudo cp "$certdir/ca.crt" \
            /usr/local/share/ca-certificates/shirokuro-ci-redis.crt
          sudo update-ca-certificates
          # The rootless Redis image must read the ephemeral test key.
          chmod 755 "$certdir"
          chmod 644 "$certdir/ca.crt" "$certdir/server.crt" "$certdir/server.key"
          docker run -d --name shirokuro-ci-redis-tls \
            -p 127.0.0.1:6380:6380 \
            -v "$certdir:/certs:ro" \
            redis:7.4-alpine redis-server \
            --port 0 --tls-port 6380 \
            --tls-cert-file /certs/server.crt \
            --tls-key-file /certs/server.key \
            --tls-ca-cert-file /certs/ca.crt \
            --tls-auth-clients no

          for i in $(seq 1 50); do
            if docker exec shirokuro-ci-redis-tls redis-cli \
                --tls --cacert /certs/ca.crt -h localhost -p 6380 ping \
                2>/dev/null | grep -qx PONG; then
              exit 0
            fi
            sleep 0.2
          done
          echo "TLS Redis fixture could not become ready."
          exit 1

      - name: Test real Production Redis TLS, cert validation and keyring restore
        run: dotnet test Shirokuro.slnx -c Release --no-build --filter 'FullyQualifiedName~RedisTlsProductionTests|FullyQualifiedName~RedisTlsKeyRingRestoreTests'
        env:
          SHIROKURO_TEST_REDIS_TLS: localhost:6380,ssl=true,sslHost=localhost,abortConnect=true,connectTimeout=3000,connectRetry=0
          # Explicit opt-in: only the dedicated ephemeral TLS fixture may be
          # paused, with a guaranteed unpause in the xUnit test finally block.
          SHIROKURO_TEST_REDIS_CHAOS: '1'

      # A separate ACL test uses the same ephemeral CA but an isolated
      # Redis TLS process, a disabled default account and keyspace-scoped
      # credentials generated for this CI runner only. Never upload ACL files.
      - name: Start isolated authenticated Redis TLS ACL fixture
        shell: bash
        run: |
          set -euo pipefail
          acldir="$(mktemp -d /tmp/shirokuro-ci-redis-acl-XXXXXX)"
          echo "SHIROKURO_TEST_REDIS_ACL_DIR=$acldir" >> "$GITHUB_ENV"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          cat > "$acldir/users.acl" <<EOF
          user default off
          user shirokuro-ci on >$password ~shirokuro:* +@read +@write +@connection +@scripting +@pubsub +@transaction -@dangerous -@admin +info +command +client +time
          EOF
          chmod 755 "$acldir"
          chmod 644 "$acldir/users.acl"

          docker run -d --name shirokuro-ci-redis-acl \
            -p 127.0.0.1:6386:6386 \
            -v "$SHIROKURO_TLS_CERT_DIR:/certs:ro" \
            -v "$acldir:/acl:ro" \
            redis:7.4-alpine redis-server \
            --port 0 --tls-port 6386 \
            --tls-cert-file /certs/server.crt \
            --tls-key-file /certs/server.key \
            --tls-ca-cert-file /certs/ca.crt \
            --tls-auth-clients no \
            --aclfile /acl/users.acl \
            --save "" --appendonly no

          # The password is masked, and never printed by redis-cli or shell.
          echo "SHIROKURO_TEST_REDIS_TLS_ACL=localhost:6386,ssl=true,sslHost=localhost,user=shirokuro-ci,password=$password,abortConnect=true,connectTimeout=3000,connectRetry=0" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if docker exec -e "REDISCLI_AUTH=$password" \
                shirokuro-ci-redis-acl redis-cli --tls \
                --cacert /certs/ca.crt --user shirokuro-ci \
                -h localhost -p 6386 ping 2>/dev/null | grep -qx PONG; then
              exit 0
            fi
            sleep 0.2
          done
          echo "ACL-enabled TLS Redis fixture did not become ready."
          exit 1

      - name: Test authenticated Production Redis TLS ACL and namespace isolation
        run: dotnet test Shirokuro.slnx -c Release --no-build --filter 'FullyQualifiedName~RedisTlsAclProductionTests'

      - name: Destroy isolated Redis TLS ACL fixture and credentials
        if: always()
        shell: bash
        run: |
          docker rm -f shirokuro-ci-redis-acl 2>/dev/null || true
          if [ -n "${SHIROKURO_TEST_REDIS_ACL_DIR:-}" ]; then
            sudo rm -rf -- "$SHIROKURO_TEST_REDIS_ACL_DIR"
          fi

      # Independent blue/green Redis ACL rotation drill. Never alter the
      # regular TLS/ACL fixtures: other tests must stay order-independent.
      - name: Start isolated Redis TLS ACL rotation fixture
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d /tmp/shirokuro-ci-redis-rotate-XXXXXX)"
          echo "SHIROKURO_TEST_REDIS_ROTATION_DIR=$dir" >> "$GITHUB_ENV"
          blue="$(openssl rand -hex 24)"
          green="$(openssl rand -hex 24)"
          admin="$(openssl rand -hex 24)"
          for secret in "$blue" "$green" "$admin"; do
            echo "::add-mask::$secret"
          done
          cat > "$dir/users.acl" <<EOF
          user default off
          user shirokuro-blue on >$blue ~shirokuro:* +@read +@write +@connection +@scripting +@pubsub +@transaction -@dangerous -@admin +info +command +client +time
          user shirokuro-operator on >$admin ~* &* +@all
          EOF
          chmod 755 "$dir"
          chmod 644 "$dir/users.acl"
          docker run -d --name shirokuro-ci-redis-rotate \
            -p 127.0.0.1:6387:6387 \
            -v "$SHIROKURO_TLS_CERT_DIR:/certs:ro" \
            -v "$dir:/acl:ro" \
            redis:7.4-alpine redis-server \
            --port 0 --tls-port 6387 \
            --tls-cert-file /certs/server.crt \
            --tls-key-file /certs/server.key \
            --tls-ca-cert-file /certs/ca.crt \
            --tls-auth-clients no \
            --aclfile /acl/users.acl \
            --save "" --appendonly no

          echo "SHIROKURO_TEST_REDIS_ROTATION_BLUE=localhost:6387,ssl=true,sslHost=localhost,user=shirokuro-blue,password=$blue,abortConnect=true,connectTimeout=1500,connectRetry=0" >> "$GITHUB_ENV"
          echo "SHIROKURO_TEST_REDIS_ROTATION_GREEN=localhost:6387,ssl=true,sslHost=localhost,user=shirokuro-green,password=$green,abortConnect=true,connectTimeout=1500,connectRetry=0" >> "$GITHUB_ENV"
          echo "SHIROKURO_TEST_REDIS_ROTATION_ADMIN=localhost:6387,ssl=true,sslHost=localhost,user=shirokuro-operator,password=$admin,allowAdmin=true,abortConnect=true,connectTimeout=1500,connectRetry=0" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if docker exec -e "REDISCLI_AUTH=$blue" \
                shirokuro-ci-redis-rotate redis-cli --tls \
                --cacert /certs/ca.crt --user shirokuro-blue \
                -h localhost -p 6387 ping 2>/dev/null | grep -qx PONG; then
              exit 0
            fi
            sleep 0.2
          done
          echo "TLS Redis ACL rotation fixture did not become ready."
          exit 1

      - name: Test Production Redis TLS ACL blue-green cutover and stale-client eviction
        run: dotnet test Shirokuro.slnx -c Release --no-build --filter 'FullyQualifiedName~RedisTlsCredentialRotationTests'

      - name: Destroy isolated Redis ACL rotation fixture and credentials
        if: always()
        shell: bash
        run: |
          docker rm -f shirokuro-ci-redis-rotate 2>/dev/null || true
          if [ -n "${SHIROKURO_TEST_REDIS_ROTATION_DIR:-}" ]; then
            sudo rm -rf -- "$SHIROKURO_TEST_REDIS_ROTATION_DIR"
          fi

      # A SECOND TLS Redis fixture is deliberately isolated from the
      # 6380 session/chaos tests. It can be completely destroyed and restored
      # from an RDB file without affecting other running CI test classes.
      - name: Start isolated TLS-only Redis RDB disaster-recovery fixture
        shell: bash
        run: |
          set -euo pipefail
          rdbdir="$(mktemp -d /tmp/shirokuro-redis-rdb-XXXXXX)"
          echo "SHIROKURO_TEST_REDIS_RDB_DIR=$rdbdir" >> "$GITHUB_ENV"
          mkdir -p "$rdbdir/source" "$rdbdir/backup" "$rdbdir/empty" "$rdbdir/restore"
          docker run -d --name shirokuro-ci-redis-rdb-source \
            -p 127.0.0.1:6381:6380 \
            -v "$SHIROKURO_TLS_CERT_DIR:/certs:ro" \
            -v "$rdbdir/source:/data" \
            redis:7.4-alpine redis-server \
            --port 0 --tls-port 6380 \
            --tls-cert-file /certs/server.crt \
            --tls-key-file /certs/server.key \
            --tls-ca-cert-file /certs/ca.crt \
            --tls-auth-clients no \
            --dir /data --dbfilename dump.rdb \
            --save "" --appendonly no
          for i in $(seq 1 50); do
            if docker exec shirokuro-ci-redis-rdb-source redis-cli \
                --tls --cacert /certs/ca.crt -h localhost -p 6380 ping \
                2>/dev/null | grep -qx PONG; then
              exit 0
            fi
            sleep 0.2
          done
          echo "Private TLS RDB fixture did not become ready."
          exit 1

      - name: Test Production Redis TLS loss and RDB recovery
        run: dotnet test Shirokuro.slnx -c Release --no-build --filter 'FullyQualifiedName~RedisTlsRdbRestoreTests'
        env:
          SHIROKURO_TEST_REDIS_RDB: localhost:6381,ssl=true,sslHost=localhost,abortConnect=true,connectTimeout=3000,connectRetry=0
          # Grants only this dedicated xUnit fixture permission to replace
          # the fixed, disposable RDB test container. Never enabled elsewhere.
          SHIROKURO_TEST_REDIS_RDB_CHAOS: '1'

      - name: Destroy isolated TLS Redis RDB fixture and sensitive snapshots
        if: always()
        shell: bash
        run: |
          docker rm -f shirokuro-ci-redis-rdb-source 2>/dev/null || true
          docker rm -f shirokuro-ci-redis-rdb-replacement 2>/dev/null || true
          if [ -n "${SHIROKURO_TEST_REDIS_RDB_DIR:-}" ]; then
            sudo rm -rf -- "$SHIROKURO_TEST_REDIS_RDB_DIR"
          fi

      # REAL Redis TLS asynchronous replication and manual promotion,
      # separate from the ordinary 6380 TLS and 6381 RDB fixtures. It is
      # intentionally not a Sentinel/Cluster automatic failover test.
      - name: Start isolated TLS Redis master and replica
        shell: bash
        run: |
          set -euo pipefail
          docker network create shirokuro-ci-redis-ha
          docker run -d --name shirokuro-ci-redis-ha-master \
            --network shirokuro-ci-redis-ha \
            -p 127.0.0.1:6382:6380 \
            -v "$SHIROKURO_TLS_CERT_DIR:/certs:ro" \
            redis:7.4-alpine redis-server \
            --port 0 --tls-port 6380 \
            --tls-cert-file /certs/server.crt \
            --tls-key-file /certs/server.key \
            --tls-ca-cert-file /certs/ca.crt \
            --tls-auth-clients no \
            --save "" --appendonly no
          docker run -d --name shirokuro-ci-redis-ha-replica \
            --network shirokuro-ci-redis-ha \
            -p 127.0.0.1:6383:6380 \
            -v "$SHIROKURO_TLS_CERT_DIR:/certs:ro" \
            redis:7.4-alpine redis-server \
            --port 0 --tls-port 6380 \
            --tls-cert-file /certs/server.crt \
            --tls-key-file /certs/server.key \
            --tls-ca-cert-file /certs/ca.crt \
            --tls-auth-clients no \
            --tls-replication yes \
            --replicaof shirokuro-ci-redis-ha-master 6380 \
            --save "" --appendonly no
          for i in $(seq 1 75); do
            if docker exec shirokuro-ci-redis-ha-replica redis-cli \
                --tls --cacert /certs/ca.crt -h localhost -p 6380 \
                INFO replication 2>/dev/null | grep -q 'master_link_status:up'; then
              exit 0
            fi
            sleep 0.2
          done
          echo "Isolated TLS Redis replica did not synchronize."
          exit 1

      - name: Test real TLS Redis replication and manual promotion
        run: dotnet test Shirokuro.slnx -c Release --no-build --filter 'FullyQualifiedName~RedisTlsReplicaPromotionTests'
        env:
          SHIROKURO_TEST_REDIS_HA_MASTER: localhost:6382,ssl=true,sslHost=localhost,abortConnect=true,connectTimeout=3000,connectRetry=0
          SHIROKURO_TEST_REDIS_HA_REPLICA: localhost:6383,ssl=true,sslHost=localhost,abortConnect=true,connectTimeout=3000,connectRetry=0
          SHIROKURO_TEST_REDIS_HA_CHAOS: '1'

      - name: Destroy isolated TLS Redis replication fixtures
        if: always()
        shell: bash
        run: |
          docker rm -f shirokuro-ci-redis-ha-master 2>/dev/null || true
          docker rm -f shirokuro-ci-redis-ha-replica 2>/dev/null || true
          docker network rm shirokuro-ci-redis-ha 2>/dev/null || true

      # Three TLS-only Sentinel instances (quorum 2) and an isolated
      # TLS master/replica on host LOOPBACK. This runner is Linux; the
      # separate host-network ports avoid Docker-private IPs being advertised
      # to managed StackExchange.Redis clients outside the Docker network.
      # All five containers have distinct names and are deleted on failure.
      - name: Start isolated Redis TLS Sentinel quorum fixture
        shell: bash
        run: |
          set -euo pipefail
          state="$(mktemp -d /tmp/shirokuro-ci-sentinel-XXXXXX)"
          echo "SHIROKURO_TEST_SENTINEL_DIR=$state" >> "$GITHUB_ENV"
          # Dedicated one-time ACL passwords; no default users and no
          # credentials in the repository or uploaded artifacts.
          app_pass="$(openssl rand -hex 24)"
          replica_pass="$(openssl rand -hex 24)"
          monitor_pass="$(openssl rand -hex 24)"
          peer_pass="$(openssl rand -hex 24)"
          sentinel_pass="$(openssl rand -hex 24)"
          for secret in "$app_pass" "$replica_pass" "$monitor_pass" "$peer_pass" "$sentinel_pass"; do
            echo "::add-mask::$secret"
          done
          mkdir -p "$state/redis-acl"
          cat > "$state/redis-acl/users.acl" <<EOF
          user default off
          user shirokuro-app on >$app_pass ~shirokuro:* +@read +@write +@connection +@scripting +@pubsub +@transaction -@dangerous -@admin +info +command +client +time
          user shirokuro-replica on >$replica_pass +psync +replconf +ping
          user shirokuro-monitor on >$monitor_pass resetchannels &__sentinel__:hello +multi +slaveof +ping +exec +subscribe +config|rewrite +role +publish +info +client|setname +client|kill +script|kill
          EOF
          chmod 755 "$state" "$state/redis-acl"
          chmod 644 "$state/redis-acl/users.acl"
          # Separate credentials for the Redis primary and Sentinel discovery.
          echo "SHIROKURO_TEST_SENTINEL_TLS=localhost:26380,localhost:26381,localhost:26382,serviceName=shirokuro-main,ssl=true,sslHost=localhost,user=shirokuro-app,password=$app_pass,sentinelUser=shirokuro-sentinel-client,sentinelPassword=$sentinel_pass,abortConnect=true,connectTimeout=4000,connectRetry=1" >> "$GITHUB_ENV"
          echo "SHIROKURO_TEST_SENTINEL_REDIS_CLI_PASSWORD=$app_pass" >> "$GITHUB_ENV"
          echo "SHIROKURO_TEST_SENTINEL_CLIENT_CLI_PASSWORD=$sentinel_pass" >> "$GITHUB_ENV"
          for id in 1 2 3; do
            mkdir -p "$state/sentinel-$id"
            chmod 777 "$state/sentinel-$id"
            cat > "$state/sentinel-$id/users.acl" <<EOF
          user default off
          user shirokuro-sentinel-peer on >$peer_pass allchannels +@all
          user shirokuro-sentinel-client on >$sentinel_pass allchannels -@all +auth +client|getname +client|id +client|setname +client|setinfo +command +hello +ping +role +info +subscribe +psubscribe +sentinel|get-master-addr-by-name +sentinel|master +sentinel|myid +sentinel|replicas +sentinel|sentinels +sentinel|masters
          EOF
            chmod 644 "$state/sentinel-$id/users.acl"
            port=$((26379 + id))
            cat > "$state/sentinel-$id/sentinel.conf" <<EOF
          port 0
          tls-port $port
          bind 127.0.0.1
          protected-mode no
          tls-cert-file /certs/server.crt
          tls-key-file /certs/server.key
          tls-ca-cert-file /certs/ca.crt
          tls-auth-clients no
          tls-replication yes
          aclfile /data/users.acl
          sentinel sentinel-user shirokuro-sentinel-peer
          sentinel sentinel-pass $peer_pass
          sentinel monitor shirokuro-main 127.0.0.1 6384 2
          sentinel auth-user shirokuro-main shirokuro-monitor
          sentinel auth-pass shirokuro-main $monitor_pass
          sentinel down-after-milliseconds shirokuro-main 1000
          sentinel failover-timeout shirokuro-main 8000
          sentinel parallel-syncs shirokuro-main 1
          EOF
            chmod 666 "$state/sentinel-$id/sentinel.conf"
          done

          docker run -d --name shirokuro-ci-sentinel-master --network host \
            -v "$SHIROKURO_TLS_CERT_DIR:/certs:ro" \
            -v "$state/redis-acl:/acl:ro" \
            redis:7.4-alpine redis-server \
            --bind 127.0.0.1 --port 0 --tls-port 6384 \
            --tls-cert-file /certs/server.crt --tls-key-file /certs/server.key \
            --tls-ca-cert-file /certs/ca.crt --tls-auth-clients no \
            --aclfile /acl/users.acl \
            --save "" --appendonly no
          docker run -d --name shirokuro-ci-sentinel-replica --network host \
            -v "$SHIROKURO_TLS_CERT_DIR:/certs:ro" \
            -v "$state/redis-acl:/acl:ro" \
            redis:7.4-alpine redis-server \
            --bind 127.0.0.1 --port 0 --tls-port 6385 \
            --tls-cert-file /certs/server.crt --tls-key-file /certs/server.key \
            --tls-ca-cert-file /certs/ca.crt --tls-auth-clients no \
            --aclfile /acl/users.acl \
            --tls-replication yes --replicaof 127.0.0.1 6384 \
            --masteruser shirokuro-replica --masterauth "$replica_pass" \
            --save "" --appendonly no

          for id in 1 2 3; do
            docker run -d --name "shirokuro-ci-sentinel-$id" --network host \
              -v "$SHIROKURO_TLS_CERT_DIR:/certs:ro" \
              -v "$state/sentinel-$id:/data" \
              redis:7.4-alpine redis-server /data/sentinel.conf --sentinel
          done
          for attempt in $(seq 1 90); do
            if docker exec -e "REDISCLI_AUTH=$sentinel_pass" \
                shirokuro-ci-sentinel-1 redis-cli --tls \
                --cacert /certs/ca.crt --user shirokuro-sentinel-client \
                -h localhost -p 26380 \
                SENTINEL get-master-addr-by-name shirokuro-main \
                2>/dev/null | grep -qx 6384 &&
               docker exec -e "REDISCLI_AUTH=$app_pass" \
                shirokuro-ci-sentinel-replica redis-cli --tls \
                --cacert /certs/ca.crt --user shirokuro-app \
                -h localhost -p 6385 \
                INFO replication 2>/dev/null | grep -q 'master_link_status:up'; then
              exit 0
            fi
            sleep 0.2
          done
          echo "Sentinel TLS quorum fixture did not synchronize."
          # On CI failure only: diagnose the isolated ephemeral containers.
          # Credentials are 48-character random hex and masked earlier;
          # redact them again before emitting any server diagnostic lines.
          for container in shirokuro-ci-sentinel-master shirokuro-ci-sentinel-replica \
              shirokuro-ci-sentinel-1 shirokuro-ci-sentinel-2 shirokuro-ci-sentinel-3; do
            docker inspect --format '{{.Name}}: {{.State.Status}} exit={{.State.ExitCode}}' "$container" || true
            docker logs --tail 35 "$container" 2>&1 |
              sed -E 's/[0-9a-f]{48}/[masked-credential]/g' |
              grep -Ei 'fatal|error|fail|ready|sentinel|sync|acl|authentication|replica|master|wrong|permission|unknown' |
              tail -20 || true
          done
          exit 1

      - name: Test automatic TLS Sentinel rediscovery and running API reconnect
        run: dotnet test Shirokuro.slnx -c Release --no-build --filter 'FullyQualifiedName~RedisTlsSentinelFailoverTests'
        env:
          SHIROKURO_TEST_SENTINEL_CHAOS: '1'

      - name: Destroy isolated Redis Sentinel TLS quorum fixture
        if: always()
        shell: bash
        run: |
          for id in 1 2 3; do
            docker rm -f "shirokuro-ci-sentinel-$id" 2>/dev/null || true
          done
          docker rm -f shirokuro-ci-sentinel-master 2>/dev/null || true
          docker rm -f shirokuro-ci-sentinel-replica 2>/dev/null || true
          if [ -n "${SHIROKURO_TEST_SENTINEL_DIR:-}" ]; then
            sudo rm -rf -- "$SHIROKURO_TEST_SENTINEL_DIR"
          fi

      - name: Destroy ephemeral Redis TLS certificates and container
        if: always()
        shell: bash
        run: |
          docker rm -f shirokuro-ci-redis-tls 2>/dev/null || true
          if [ -n "${SHIROKURO_TLS_CERT_DIR:-}" ]; then
            rm -rf "$SHIROKURO_TLS_CERT_DIR"
          fi
          sudo rm -f /usr/local/share/ca-certificates/shirokuro-ci-redis.crt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci --no-audit --no-fund
      - run: npm run test:unit
      - run: npm run build
      # Hosted runners normally ship Google Chrome with its system libraries.
      # Prefer that verified browser to avoid apt mirror/DNS outages. When
      # unavailable (custom runner), retain a bounded Chromium installer.
      - name: Select available Playwright browser, with bounded install fallback
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo "SHIROKURO_PLAYWRIGHT_USE_SYSTEM_CHROME=1" >> "$GITHUB_ENV"
            exit 0
          fi
          for attempt in 1 2; do
            if timeout --signal=TERM --kill-after=5s 150s \
                npx playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "Chromium installation failed after bounded retries."
              exit 1
            fi
            sleep 3
          done
      - run: npm run test:e2e


  artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-art.txt
      - run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v


